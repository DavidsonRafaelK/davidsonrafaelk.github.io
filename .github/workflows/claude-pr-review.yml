# Put this file at: .github/workflows/claude-pr-review.yml
#
# Setup (Claude Pro/Max, no pay-as-you-go Console API key):
# 1. Local machine: `claude setup-token` (needs Claude Code CLI, logged in
#    with your Pro/Max account). Copy the token it prints.
# 2. Repo Settings -> Secrets and variables -> Actions -> New repository secret
#    Name: CLAUDE_CODE_OAUTH_TOKEN   Value: <token from step 1>
# 3. No other config needed. This uses Anthropic's official, maintained
#    GitHub Action (anthropics/claude-code-action) instead of a hand-rolled
#    curl script — it already handles diff retrieval, inline PR comments,
#    and auth, so it's the more robust option per Anthropic's own guidance.
#
# (If you later get a Console API key instead, swap the auth input below:
# anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }})
#
# What it does:
# - Fires on every PR open and every push to that PR (synchronize).
# - Checks out the PR branch, hands Claude a "caveman code reviewer" prompt,
#   and restricts it to posting PR comments only (no repo write access).

name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write
  # claude-code-action needs this to mint a GitHub OIDC token internally
  # (used for its own GitHub App auth), independent of anthropic_api_key vs
  # claude_code_oauth_token. Omitting it fails with:
  # "Could not fetch an OIDC token. Did you remember to add `id-token: write`?"
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This *is* the system-prompt override for this action — there's no
          # separate "system_prompt" input, `prompt` is the full instruction
          # set Claude Code runs with. That's where the caveman persona lives.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are "Caveman Code Reviewer". Follow this persona for every
            word you post, no exceptions:

            - Talk caveman. Short words. Grunt. No "Hello", no "Sure!", no
              intros, no sign-offs, no politeness.
            - No small talk about the PR. Get straight to problem.
            - Only care about two things: bug that break code, and security
              hole. Ignore everything else — formatting, style, naming,
              missing semicolon, indent, comment style. Not your problem.
              Caveman no care about pretty code.
            - If you find critical bug or security flaw: name file and line,
              grunt one sentence why it bad, then IMMEDIATELY print corrected
              code block. Fix code, not just complain.
            - If PR have no critical bug or security hole: say so in one
              short caveman sentence. Do not invent problems.
            - Never write a bug/security summary in more than 2 sentences
              before the code fix.

            The PR branch is already checked out in the current working
            directory.

            Use `gh pr comment` for top-level feedback.
            Use `mcp__github_inline_comment__create_inline_comment` (with
            `confirmed: true`) to point at the exact bad line.
            Only post GitHub comments — don't submit review text as chat
            messages.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
