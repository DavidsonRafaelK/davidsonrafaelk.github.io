name: Post-Deploy Check

on:
  push:
    branches: ["main"]
  workflow_dispatch: # manual trigger option

permissions:
  contents: read
  issues: write

env:
  SITE_URL: https://www.davidsonrafael.xyz

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # A 200 on its own proves nothing: the previous deployment keeps serving
      # while a new one builds, and it keeps serving if that build fails. So
      # wait for the site to report the commit this run was triggered for.
      - name: Wait for this commit to be live
        env:
          EXPECTED_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          live=""
          code=""
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL/")
            live=$(curl -sI "$SITE_URL/" | tr -d '\r' \
              | awk 'tolower($1) == "x-commit-sha:" { print $2 }')

            if [ "$code" = "200" ] && [ "$live" = "$EXPECTED_SHA" ]; then
              echo "Deployment for $EXPECTED_SHA is live (attempt $i)."
              exit 0
            fi

            echo "Attempt $i: status=$code live=${live:-none} expected=$EXPECTED_SHA, retrying in 15s..."
            sleep 15
          done

          # A newer push can win the race and deploy over this one. That is not a
          # failure: this commit is in production history, and the newer commit's
          # own run checks it.
          if [ -n "$live" ] && [ "$live" != "$EXPECTED_SHA" ]; then
            status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${EXPECTED_SHA}...${live}" \
              --jq .status 2>/dev/null || echo "unknown")
            if [ "$status" = "behind" ] || [ "$status" = "identical" ]; then
              echo "Superseded: $live is live and already contains $EXPECTED_SHA. Passing."
              exit 0
            fi
          fi

          {
            echo "- expected commit \`$EXPECTED_SHA\` never went live within 5 minutes"
            echo "- last status: \`$code\`, live commit: \`${live:-none}\`"
            if [ -z "$live" ]; then
              echo "- no \`x-commit-sha\` header was returned, so the live build predates this check"
            fi
          } > /tmp/failures.txt
          cat /tmp/failures.txt >&2
          exit 1

      - name: Check key endpoints
        id: endpoints
        run: |
          failures=""
          for path in "/" "/llms.txt" "/sitemap.xml" "/robots.txt"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "$SITE_URL$path")
            echo "$path -> $code"
            if [ "$code" != "200" ]; then
              failures="$failures\n- $path returned $code"
            fi
          done
          if [ -n "$failures" ]; then
            echo -e "Failures:$failures"
            echo -e "$failures" > /tmp/failures.txt
            exit 1
          fi

      - name: File issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create deploy-check --color d93f0b --description "Post-deploy endpoint check failures" --force
          body="Post-deploy check failed for $SITE_URL after commit ${{ github.sha }}.\n\n$(cat /tmp/failures.txt 2>/dev/null || echo 'Site did not come back up within 5 minutes.')\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --label deploy-check --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "Post-deploy check failing" --label deploy-check --body "$body"
          fi
