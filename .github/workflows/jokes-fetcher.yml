name: Fetch Jokes

on:
  schedule:
    - cron: "0 3 * * *" # every day at 03:00 UTC
  workflow_dispatch: # manual trigger option

permissions:
  contents: write

jobs:
  fetch-jokes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Fetch new jokes
        run: bun run scripts/fetch-jokes.ts

      - name: Format
        run: bunx @biomejs/biome check --write apps/web/src/content/dad-jokes.ts apps/web/src/content/programmer-jokes.ts

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No new jokes this run."
            exit 0
          fi
          # Author the commit as Davidson so it lands on his contribution
          # graph. The push still runs under GITHUB_TOKEN, which only affects
          # the committer field; the graph counts the author.
          git config user.name "DavidsonRafaelK"
          git config user.email "davidson.rafael120@gmail.com"
          git add apps/web/src/content/dad-jokes.ts apps/web/src/content/programmer-jokes.ts
          git commit -m "chore: fetch new jokes"
          git push
